name: sugarglider-social

x-social-image: &social-image
  image: sugarglider-social:${SUGARGLIDER_DEPLOY_REVISION:?Set the reviewed Git commit}
  build:
    context: ../..
    dockerfile: apps/social/Dockerfile

services:
  social:
    <<: *social-image
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs: [/tmp:size=32m,mode=1777]
    stop_grace_period: 30s
    environment:
      SUGARGLIDER_SOCIAL_PUBLIC_ORIGIN: https://${SUGARGLIDER_DOMAIN:?Set the approved public hostname}
      SUGARGLIDER_SOCIAL_DATA_DIRECTORY: /data
    volumes:
      - social-data:/data
    networks: [private]
    # Intentionally no published API port. Only Caddy may supply forwarded headers.
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/ready',headers={'Host':os.environ['SUGARGLIDER_SOCIAL_PUBLIC_ORIGIN'].removeprefix('https://')}); urllib.request.urlopen(r,timeout=4).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}

  https:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    environment:
      SUGARGLIDER_DOMAIN: ${SUGARGLIDER_DOMAIN:?Set the approved public hostname}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [private, public]
    depends_on:
      social: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}

  backup:
    <<: *social-image
    profiles: [maintenance]
    user: 10001:10001
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    network_mode: none
    volumes:
      # SQLite WAL readers require the shared writable -shm lock file.
      # The command itself opens both source databases with mode=ro.
      - social-data:/data
      - social-backups:/backups
    command: [python, -m, sugarglider.social_server, backup, --data-directory, /data, --destination, /backups]

networks:
  private: {internal: true}
  public: {}

volumes:
  social-data: {}
  social-backups: {}
  caddy-data: {}
  caddy-config: {}
