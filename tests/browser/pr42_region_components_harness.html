<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>PR42 scoped region components harness</title>
  <pre id="result">running</pre>
  <script src="../../src/sugarglider/web/static/vendor/pmtiles-4.5.0/pmtiles.js"></script>
  <script type="module">
    const result = document.getElementById("result");
    const fail = (error) => { result.dataset.status = "failed"; result.textContent = error?.stack ?? String(error); };
    window.addEventListener("error", (event) => fail(event.error ?? event.message));
    window.addEventListener("unhandledrejection", (event) => fail(event.reason));
    try {
      const { runPr42RegionComponentsHarness } = await import("./pr42_region_components_harness.js");
      const scenarios = await runPr42RegionComponentsHarness();
      if (result.dataset.status !== "failed") { result.dataset.status = "passed"; result.textContent = JSON.stringify(scenarios); }
    } catch (error) { fail(error); }
  </script>
</html>
