<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>PR35 local Auto Tour harness</title>
  <pre id="result">running</pre>
  <script>
    window.pr35HarnessResult = document.getElementById("result");
    window.pr35UnhandledRejection = null;
    window.addEventListener("error", (event) => {
      window.pr35HarnessResult.dataset.status = "failed";
      window.pr35HarnessResult.textContent = event.error?.stack ?? event.message;
      document.title = "PR35 local Auto Tour harness failed";
    });
    window.addEventListener("unhandledrejection", (event) => {
      window.pr35UnhandledRejection = event.reason;
      window.pr35HarnessResult.dataset.status = "failed";
      window.pr35HarnessResult.textContent = event.reason instanceof Error
        ? event.reason.stack
        : String(event.reason);
      document.title = "PR35 local Auto Tour harness failed";
    });
  </script>
  <script type="module">
    import { runPr35LocalAutoTourHarness } from "./pr35_local_auto_tour_harness.js";

    const result = window.pr35HarnessResult;
    try {
      const scenarios = await runPr35LocalAutoTourHarness();
      await new Promise((resolve) => window.setTimeout(resolve, 0));
      if (window.pr35UnhandledRejection !== null) throw window.pr35UnhandledRejection;
      if (result.dataset.status === "failed") throw new Error(result.textContent);
      result.dataset.status = "passed";
      result.textContent = JSON.stringify(scenarios);
      document.title = `PR35 local Auto Tour harness passed ${scenarios.length}`;
    } catch (error) {
      result.dataset.status = "failed";
      result.textContent = error instanceof Error ? error.stack : String(error);
      document.title = "PR35 local Auto Tour harness failed";
    }
  </script>
</html>
