<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>PR38 Local Waypoint Route harness</title>
  <pre id="result">running</pre>
  <script>
    const result = document.getElementById("result");
    function fail(error) {
      result.dataset.status = "failed";
      result.textContent = error instanceof Error ? error.stack : String(error);
      document.title = "PR38 Local Waypoint Route harness failed";
    }
    window.addEventListener("error", (event) => fail(event.error ?? event.message));
    window.addEventListener("unhandledrejection", (event) => fail(event.reason));
  </script>
  <script type="module">
    import { runPr38LocalWaypointRouteHarness } from "./pr38_local_waypoint_route_harness.js";
    try {
      const scenarios = await runPr38LocalWaypointRouteHarness();
      if (result.dataset.status === "failed") throw new Error(result.textContent);
      result.dataset.status = "passed";
      result.textContent = JSON.stringify(scenarios);
      document.title = `PR38 Local Waypoint Route harness passed ${scenarios.length}`;
    } catch (error) { fail(error); }
  </script>
</html>
