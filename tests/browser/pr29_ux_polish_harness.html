<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR29 UX polish harness</title>
  <pre id="result">running</pre>
  <script>
    window.pr29UxHarnessResult = document.getElementById("result");
    window.pr29UxUnhandledRejection = null;
    window.addEventListener("unhandledrejection", (event) => {
      window.pr29UxUnhandledRejection = event.reason;
      window.pr29UxHarnessResult.dataset.status = "failed";
      window.pr29UxHarnessResult.textContent = String(event.reason);
    });
  </script>
  <script type="module">
    import { runPr29UxPolishHarness } from "./pr29_ux_polish_harness.js";

    try {
      const scenarios = await runPr29UxPolishHarness();
      await new Promise((resolve) => window.setTimeout(resolve, 0));
      if (window.pr29UxUnhandledRejection) throw window.pr29UxUnhandledRejection;
      window.pr29UxHarnessResult.dataset.status = "passed";
      window.pr29UxHarnessResult.textContent = JSON.stringify(scenarios);
      document.title = `PR29 UX polish harness passed ${scenarios.length}`;
    } catch (error) {
      window.pr29UxHarnessResult.dataset.status = "failed";
      window.pr29UxHarnessResult.textContent = error instanceof Error
        ? error.stack
        : String(error);
      document.title = "PR29 UX polish harness failed";
    }
  </script>
</html>
