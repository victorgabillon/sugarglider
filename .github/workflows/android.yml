name: Android checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Valhalla Mobile 0.6.4 / models 0.6.0 emit Java 21 bytecode.
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test both build variants, lint, and build debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest testReleaseUnitTest lintRelease
      - name: Check native 16 KiB compatibility in debug APK
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 4 "$APK"
          unzip -p "$APK" lib/arm64-v8a/libvalhalla-wrapper.so > "$RUNNER_TEMP/valhalla-wrapper.so"
          python3 - <<'PY'
          import subprocess
          import os
          from pathlib import Path

          native = Path(os.environ["RUNNER_TEMP"]) / "valhalla-wrapper.so"
          assert native.stat().st_size > 0
          output = subprocess.check_output(["readelf", "-W", "-l", str(native)], text=True)
          alignments = [
              int(line.split()[-1], 16)
              for line in output.splitlines()
              if line.lstrip().startswith("LOAD ")
          ]
          assert alignments and min(alignments) >= 0x4000, alignments
          print("16 KiB ELF LOAD and APK page alignment checks passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sugarglider-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
