name: Elevation browser regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Check regional retention with explicit garbage collection
        run: node tests/browser/pr93_retention_acceptance.cjs
      - name: Check elevation input and map lifecycle
        env:
          ELEVATION_EVIDENCE_DIR: ${{ runner.temp }}/elevation-browser
        run: node tests/browser/pr92_elevation_acceptance.cjs
      - name: Check V2 release, source attribution and datum contracts
        run: node tests/browser/pr94_release_acceptance.cjs
      - name: Check installed IGN sources, offline disclosure and keyboard layout
        run: node tests/browser/ign_attribution_acceptance.cjs
      - name: Check complete offline data notices and export-workflow access
        run: node tests/browser/data_notices_acceptance.cjs
      - name: Check offline product and first-party failure boundaries
        run: node tests/browser/pr98_offline_acceptance.cjs
      - name: Check remembered regional selection and bundled startup order
        run: node tests/browser/region_preference_acceptance.cjs
